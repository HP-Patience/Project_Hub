<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>项目中枢 · Project Hub</title>
<meta name="description" content="Celyn 的项目分类索引：AI 与智能体、效率与时间、创作与媒体、网站与前端、学习与笔记、开发与基础设施、归档与资料。">
<meta name="theme-color" content="#08090b">
<style>
  :root{
    --bg:#08090b;
    --panel:#0f1115;
    --panel-2:#14171d;
    --line:rgba(255,255,255,.075);
    --line-strong:rgba(255,255,255,.14);
    --text:#e9ebef;
    --muted:#8d94a0;
    --dim:#6a717d;
    --accent:#e0b070;
    --accent-soft:rgba(224,176,112,.10);
    --green:#6ee7a8;
    --blue:#7dd3fc;
    --amber:#f0b866;
    --violet:#a78bfa;
    --gray:#8b929c;
    --serif:"Iowan Old Style","Palatino Linotype",Georgia,"Songti SC","Noto Serif SC",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,"SFMono-Regular","JetBrains Mono",Consolas,monospace;
    --maxw:1180px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:var(--sans);font-size:15px;line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(900px 480px at 18% -8%,rgba(224,176,112,.10),transparent 62%),
      radial-gradient(700px 420px at 88% 4%,rgba(125,211,252,.06),transparent 60%);
  }
  a{color:inherit;text-decoration:none}
  ::selection{background:rgba(224,176,112,.24)}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px;position:relative;z-index:1}
  .skip{position:absolute;left:-9999px}
  .skip:focus{left:16px;top:16px;background:var(--panel);padding:10px 14px;border:1px solid var(--line-strong);border-radius:8px;z-index:99}

  /* ---------- hero ---------- */
  .hero{padding:86px 0 44px;border-bottom:1px solid var(--line)}
  .eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--dim);display:flex;align-items:center;gap:10px
  }
  .eyebrow .sep{width:22px;height:1px;background:var(--line-strong)}
  .hero h1{
    font-family:var(--serif);font-weight:400;letter-spacing:.01em;
    font-size:clamp(2.7rem,6.4vw,4.6rem);line-height:1.04;margin:22px 0 0;
  }
  .hero h1 em{font-style:normal;color:var(--accent)}
  .lede{max-width:60ch;color:var(--muted);margin:20px 0 0;font-size:15.5px;text-wrap:pretty}
  .stats{display:flex;flex-wrap:wrap;gap:0;margin-top:42px;border-top:1px solid var(--line)}
  .stat{padding:18px 34px 0 0;margin-right:34px;border-right:1px solid var(--line)}
  .stat:last-child{border-right:0;margin-right:0;padding-right:0}
  .stat b{display:block;font-family:var(--serif);font-size:30px;font-weight:400;line-height:1.1}
  .stat span{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}

  /* ---------- toolbar ---------- */
  .toolbar{
    position:sticky;top:0;z-index:20;
    background:rgba(8,9,11,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .toolbar-inner{display:flex;align-items:center;gap:18px;padding-block:14px}
  .search{position:relative;flex:0 0 190px}
  .search input{
    width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;
    color:var(--text);font-family:var(--sans);font-size:13px;padding:9px 34px 9px 34px;
    outline:none;transition:border-color .2s
  }
  .search input:focus{border-color:rgba(224,176,112,.5)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5}
  .search kbd{
    position:absolute;right:9px;top:50%;transform:translateY(-50%);
    font-family:var(--mono);font-size:10px;color:var(--dim);
    border:1px solid var(--line);border-radius:4px;padding:1px 5px
  }
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0;min-width:0}
  .chips::-webkit-scrollbar{display:none}
  .chips.fade-r{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent)}
  .chips.fade-l{-webkit-mask-image:linear-gradient(90deg,transparent,#000 34px);mask-image:linear-gradient(90deg,transparent,#000 34px)}
  .chips.fade-l.fade-r{-webkit-mask-image:linear-gradient(90deg,transparent,#000 34px,#000 calc(100% - 34px),transparent);mask-image:linear-gradient(90deg,transparent,#000 34px,#000 calc(100% - 34px),transparent)}
  .chip{
    flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--muted);
    font-family:var(--sans);font-size:11.5px;padding:5px 9px;border-radius:999px;cursor:pointer;
    transition:all .18s;white-space:nowrap
  }
  .chip:hover{color:var(--text);border-color:var(--line-strong)}
  .chip[aria-pressed="true"]{background:var(--accent-soft);border-color:rgba(224,176,112,.42);color:var(--accent)}
  .chip i{font-style:normal;font-family:var(--mono);font-size:10.5px;opacity:.6;margin-left:6px}

  /* ---------- sections ---------- */
  main{padding:56px 0 40px}
  .sec{margin-bottom:64px;scroll-margin-top:86px}
  .sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:26px}
  .sec-title{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .sec-title .idx{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.1em}
  .sec-title h2{font-family:var(--serif);font-weight:400;font-size:26px;margin:0;letter-spacing:.01em}
  .sec-title .en{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .sec-head p{margin:0;color:var(--dim);font-size:12.5px;max-width:44ch;text-align:right;text-wrap:balance}

  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .card{
    position:relative;background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);border-radius:12px;padding:18px 18px 14px;
    display:flex;flex-direction:column;gap:10px;
    transition:border-color .2s,transform .2s,box-shadow .2s;
  }
  .card:hover{border-color:var(--line-strong);transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .card:focus-within{border-color:rgba(224,176,112,.45)}
  .card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:10.5px}
  .status{display:inline-flex;align-items:center;gap:6px;color:var(--dim);letter-spacing:.04em}
  .status i{width:5px;height:5px;border-radius:50%;background:currentColor;display:inline-block}
  .status[data-s="active"]{color:var(--green)}
  .status[data-s="maintained"]{color:var(--blue)}
  .status[data-s="paused"]{color:var(--amber)}
  .status[data-s="fork"]{color:var(--violet)}
  .status[data-s="archived"],.status[data-s="merged"],.status[data-s="local"]{color:var(--gray)}
  .owner{color:var(--dim);letter-spacing:.02em}
  .vis{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--amber);
    border:1px solid rgba(240,184,102,.32);background:rgba(240,184,102,.07);
    border-radius:4px;padding:1px 5px;margin-left:auto}
  .card h3{margin:0;font-size:17px;font-weight:600;letter-spacing:.005em;line-height:1.35}
  .card h3 a{background-image:linear-gradient(var(--accent),var(--accent));background-size:0 1px;background-repeat:no-repeat;background-position:0 100%;transition:background-size .25s}
  .card:hover h3 a{background-size:100% 1px}
  .tagline{margin:0;color:#c3c8d1;font-size:13px;line-height:1.6}
  .tagline.masked{display:flex;align-items:center;gap:8px;min-height:21px}
  .tagline.masked .bar{display:inline-block;height:11px;width:56%;border-radius:3px;
    background:linear-gradient(90deg,rgba(255,255,255,.13),rgba(255,255,255,.055))}
  .tagline.masked em{font-style:normal;font-family:var(--mono);font-size:9.5px;
    letter-spacing:.08em;color:var(--dim)}
  .stack{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
  .stack span{
    font-family:var(--mono);font-size:10px;color:var(--muted);
    border:1px solid var(--line);border-radius:4px;padding:2px 6px;letter-spacing:.02em
  }
  .card-foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);margin-top:8px;padding-top:10px;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
  .card-foot .go{color:var(--muted);display:inline-flex;gap:4px;align-items:center}
  .card:hover .card-foot .go{color:var(--accent)}
  .sub-open{background:none;border:0;padding:0;font:inherit;color:var(--accent);margin-right:12px;
    display:inline-flex;gap:4px;align-items:center;cursor:pointer;letter-spacing:.02em}
  .sub-open:hover{text-decoration:underline}
  .sub-open i{font-style:normal;font-size:9.5px;border:1px solid rgba(224,176,112,.4);
    border-radius:3px;padding:0 4px;opacity:.85}

  /* ---------- 二级视图（子项目） ---------- */
  .sheet{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:24px}
  .sheet.show{display:flex}
  .sheet-bg{position:absolute;inset:0;background:rgba(6,7,10,.74);backdrop-filter:blur(3px)}
  .sheet-box{position:relative;width:min(760px,100%);max-height:82vh;overflow:hidden;
    display:flex;flex-direction:column;background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line-strong);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
  .sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
    padding:20px 22px 14px;border-bottom:1px solid var(--line)}
  .sheet-head h2{margin:0;font-family:var(--serif);font-weight:400;font-size:21px}
  .sheet-head p{margin:4px 0 0;color:var(--dim);font-size:12px}
  .sheet-close{background:none;border:1px solid var(--line);border-radius:6px;color:var(--muted);
    font-family:var(--mono);font-size:11px;padding:4px 9px;cursor:pointer}
  .sheet-close:hover{color:var(--accent);border-color:rgba(224,176,112,.4)}
  .sheet-body{overflow-y:auto;padding:8px 22px 20px}
  .sub-item{display:block;padding:13px 0;border-bottom:1px solid var(--line)}
  .sub-item:last-child{border-bottom:0}
  .sub-item:hover .sub-name{color:var(--accent)}
  .sub-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .sub-name{font-size:14.5px;font-weight:600;letter-spacing:.005em;transition:color .2s}
  .sub-date{font-family:var(--mono);font-size:10.5px;color:var(--dim);white-space:nowrap}
  .sub-desc{margin:3px 0 6px;color:var(--muted);font-size:12.5px;line-height:1.6}
  .sub-stack{display:flex;flex-wrap:wrap;gap:5px}
  .sub-stack span{font-family:var(--mono);font-size:9.5px;color:var(--dim);
    border:1px solid var(--line);border-radius:3px;padding:1px 5px}
  body.locked{overflow:hidden}

  /* featured */
  .featured{margin-bottom:70px}
  .f-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .f-card{
    position:relative;overflow:hidden;border:1px solid var(--line);border-radius:14px;
    background:linear-gradient(150deg,rgba(224,176,112,.07),rgba(20,23,29,.9) 45%,var(--panel));
    padding:24px 22px 20px;display:flex;flex-direction:column;gap:12px;min-height:196px;
    transition:border-color .2s,transform .2s
  }
  .f-card:hover{border-color:rgba(224,176,112,.36);transform:translateY(-3px)}
  .f-card .num{font-family:var(--serif);font-size:13px;color:var(--accent);opacity:.8}
  .f-card h3{margin:0;font-family:var(--serif);font-weight:400;font-size:23px;line-height:1.2}
  .f-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
  .f-card .f-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
  .f-card .f-foot .go{color:var(--accent)}

  .empty{display:none;text-align:center;padding:70px 0;color:var(--dim);font-size:13px}
  .empty.show{display:block}

  footer{border-top:1px solid var(--line);padding:34px 0 46px;margin-top:20px}
  .foot-inner{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
  .foot-inner a{color:var(--muted);border-bottom:1px solid var(--line-strong)}
  .foot-inner a:hover{color:var(--accent)}
  .mono{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em}

  @media (max-width:1100px){
    .search{flex:0 0 186px}
    .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
    .chips::-webkit-scrollbar{display:none}
  }
  @media (max-width:980px){
    .grid,.f-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .sec-head p{display:none}
  }
  @media (max-width:720px){
    .wrap{padding:0 18px}
    .hero{padding:60px 0 34px}
    .toolbar-inner{flex-wrap:wrap;gap:10px;padding-block:12px}
    .search{flex:1 1 100%}
    .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
    .grid,.f-grid{grid-template-columns:1fr}
    .stat{padding-right:20px;margin-right:20px}
    .stat b{font-size:24px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
  }
</style>
</head>

const CATS = DATA.categories;
const PROJECTS = DATA.projects;

const TODAY = new Date("2026-11-12T00:00:00");
const DAY = 86400000;

function statusOf(p){
  if (p.statusOverride) return p.statusOverride;
  const d = (TODAY - new Date(p.updated + "T00:00:00")) / DAY;
  if (d <= 14) return "active";
  if (d <= 90) return "maintained";
  return "paused";
}
const STATUS_LABEL = {
  active:"活跃", maintained:"维护中", paused:"暂缓",
  fork:"上游衍生", archived:"已归档", merged:"已并入", local:"仅本地"
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const urlOf = p => (p.visibility === "private" || p.statusOverride === "local")
  ? "" : (p.repoUrl || `https://github.com/${p.owner}/${p.name}`);

PROJECTS.forEach(p => { p._s = statusOf(p); });

/* stats */
const latest = PROJECTS.map(p=>p.updated).sort().pop();
const pubCount = PROJECTS.filter(p=>p.visibility !== "private").length;
const privCount = PROJECTS.length - pubCount;
document.getElementById("stats").innerHTML = [
  ["项目总数", PROJECTS.length],
  ["公开仓库", pubCount],
  ["私有仓库", privCount],
  ["最近更新", latest.slice(5)]
].map(([k,v])=>`<div class="stat"><b>${v}</b><span>${k}</span></div>`).join("");

/* featured */
document.getElementById("f-grid").innerHTML = PROJECTS.filter(p=>p.featured).slice(0,6).map((p,i)=>{
  const u = urlOf(p);
  const link = u ? `<a class="go" href="${u}" target="_blank" rel="noopener">GitHub ↗</a>` : `<span class="go">${p.visibility === "private" ? "私有仓库" : "未发布"}</span>`;
  return `<article class="f-card">
    <div class="num">${String(i+1).padStart(2,"0")}</div>
    <h3>${u?`<a href="${u}" target="_blank" rel="noopener">${esc(p.name)}</a>`:esc(p.name)}</h3>
    <p>${p.masked ? "描述已隐藏" : esc(p.tagline)}</p>
    <div class="f-foot"><span>${esc(p.stack.slice(0,2).join(" · "))}</span>${link}</div>
  </article>`;
}).join("");

/* sections */
const sectionsEl = document.getElementById("sections");
sectionsEl.innerHTML = CATS.map((c,ci)=>{
  const items = PROJECTS.filter(p=>p.category===c.id)
    .sort((a,b)=> (b.featured?1:0)-(a.featured?1:0) || b.updated.localeCompare(a.updated));
  if(!items.length) return "";
  const cards = items.map(p=>{
    const u = urlOf(p);
    const name = u ? `<a href="${u}" target="_blank" rel="noopener">${esc(p.name)}</a>` : esc(p.name);
    const owner = p.owner !== DATA.meta.owner ? `<span class="owner">@${esc(p.owner)}</span>` : "";
    const foot = u
      ? `<a class="go" href="${u}" target="_blank" rel="noopener">GitHub ↗</a>`
      : `<span class="go">${p.visibility === "private" ? "私有仓库" : "未发布"}</span>`;
    const home = p.homepage ? `<a class="go" href="${esc(p.homepage)}" target="_blank" rel="noopener" style="margin-right:10px">在线 ↗</a>` : "";
    const subs = p.subprojects || [];
    const subBtn = subs.length
      ? `<button class="sub-open" type="button" data-sub="${esc(p.name)}"><i>${subs.length}</i>子项目 →</button>`
      : "";
    const searchText = [p.name, p.tagline, p.stack.join(" "), p.tags.join(" "), p.owner]
      .concat(subs.map(s => s.name + " " + s.tagline + " " + s.stack.join(" "))).join(" ");
    return `<article class="card" data-search="${esc(searchText.toLowerCase())}">
      <div class="card-top">
        <span class="status" data-s="${p._s}"><i></i>${STATUS_LABEL[p._s]||p._s}</span>
        ${p.visibility === "private" ? '<span class="vis">私有</span>' : ""}
        ${owner}
      </div>
      <h3>${name}</h3>
      <p class="tagline${p.masked ? " masked" : ""}">${p.masked ? '<span class="bar"></span><em>描述已隐藏</em>' : esc(p.tagline)}</p>
      <div class="stack">${p.stack.map(s=>`<span>${esc(s)}</span>`).join("")}</div>
      <div class="card-foot"><span>更新 ${p.updated.slice(5)}</span><span>${subBtn}${home}${foot}</span></div>
    </article>`;
  }).join("");
  return `<section class="sec" id="cat-${c.id}" data-cat="${c.id}">
    <div class="sec-head">
      <div class="sec-title">
        <span class="idx">${String(ci+1).padStart(2,"0")}</span>
        <h2>${esc(c.name)}</h2>
        <span class="en">${esc(c.en)} · ${items.length}</span>
      </div>
      <p>${esc(c.desc)}</p>
    </div>
    <div class="grid">${cards}</div>
  </section>`;
}).join("");

/* 二级视图：子项目 */
const sheetEl = document.getElementById("sheet");
const sheetTitle = document.getElementById("sheet-title");
const sheetMeta = document.getElementById("sheet-meta");
const sheetBody = document.getElementById("sheet-body");
const subOwner = DATA.meta.owner;

function openSheet(name){
  const p = PROJECTS.find(x => x.name === name);
  if(!p || !p.subprojects || !p.subprojects.length) return;
  const base = p.repoUrl || `https://github.com/${p.owner}/${p.name}`;
  const treeBase = base.replace(/\/+$/, "") + "/tree/main/";
  sheetTitle.textContent = `${p.name} 的子项目`;
  sheetMeta.innerHTML = `${p.subprojects.length} 个独立工具 · 同一仓库下的子目录${p.owner !== subOwner ? " · @" + esc(p.owner) : ""}`;
  sheetBody.innerHTML = p.subprojects
    .slice()
    .sort((a,b) => b.updated.localeCompare(a.updated))
    .map(s => `<a class="sub-item" href="${esc(treeBase + encodeURIComponent(s.name))}" target="_blank" rel="noopener">
      <div class="sub-top"><span class="sub-name">${esc(s.name)}</span><span class="sub-date">${esc(s.updated)}</span></div>
      <p class="sub-desc">${esc(s.tagline)}</p>
      <div class="sub-stack">${s.stack.map(t=>`<span>${esc(t)}</span>`).join("")}</div>
    </a>`).join("");
  sheetEl.classList.add("show");
  document.body.classList.add("locked");
}

function closeSheet(){
  sheetEl.classList.remove("show");
  document.body.classList.remove("locked");
}

document.addEventListener("click", e => {
  const open = e.target.closest("[data-sub]");
  if(open){ openSheet(open.dataset.sub); return; }
  if(e.target.closest("[data-close]")) closeSheet();
});


/* filters */
const chipsEl = document.getElementById("chips");
let activeCat = "all";
const chipData = [{id:"all",name:"全部",n:PROJECTS.length}].concat(CATS.map(c=>({id:c.id,name:c.name,n:PROJECTS.filter(p=>p.category===c.id).length})));
chipsEl.innerHTML = chipData.map(c=>`<button class="chip" data-cat="${c.id}" aria-pressed="${c.id==="all"}">${esc(c.name)}<i>${c.n}</i></button>`).join("");

const qEl = document.getElementById("q");
const emptyEl = document.getElementById("empty");

function apply(){
  const q = qEl.value.trim().toLowerCase();
  let visible = 0;
  document.querySelectorAll(".sec").forEach(sec=>{
    const catOk = activeCat === "all" || sec.dataset.cat === activeCat;
    let secVisible = 0;
    sec.querySelectorAll(".card").forEach(card=>{
      const hit = catOk && (!q || card.dataset.search.includes(q));
      card.style.display = hit ? "" : "none";
      if(hit) secVisible++;
    });
    sec.style.display = secVisible ? "" : "none";
    visible += secVisible;
  });
  document.getElementById("featured").style.display = (activeCat==="all" && !q) ? "" : "none";
  emptyEl.classList.toggle("show", visible===0);
}

const maskChips = () => {
  const c = chipsEl, max = c.scrollWidth - c.clientWidth;
  c.classList.toggle("fade-r", max > 2 && c.scrollLeft < max - 2);
  c.classList.toggle("fade-l", c.scrollLeft > 2);
};
chipsEl.addEventListener("scroll", maskChips, {passive:true});
window.addEventListener("resize", maskChips);
maskChips();

chipsEl.addEventListener("click", e=>{
  const b = e.target.closest(".chip"); if(!b) return;
  activeCat = b.dataset.cat;
  chipsEl.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed", String(c===b)));
  apply();
});
qEl.addEventListener("input", apply);
document.addEventListener("keydown", e=>{
  if(e.key === "Escape" && sheetEl.classList.contains("show")){ closeSheet(); return; }
  if(e.key === "/" && document.activeElement !== qEl){ e.preventDefault(); qEl.focus(); }
  if(e.key === "Escape" && document.activeElement === qEl){ qEl.value=""; apply(); qEl.blur(); }
});
</script>
</body>
</html>
